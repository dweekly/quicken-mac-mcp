name: CI

# Runs lint + tests + build on every push to main and on every pull request,
# so failures surface before merge / tag rather than during the publish run.
#
# Live-DB integration tests in src/__tests__ auto-skip when no Quicken
# database is reachable, so they sit out in CI without special handling.

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same ref when a new commit lands. Saves
# minutes on rapid-fire PRs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
