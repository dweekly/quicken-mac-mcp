name: Publish release

# A published GitHub Release is the single release trigger. It publishes the
# npm package, attaches architecture-specific Claude Desktop bundles, and then
# updates the MCP Registry. workflow_dispatch remains an npm-only escape hatch.
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret
# required. Configure once at:
#   https://www.npmjs.com/package/quicken-mac-mcp/access  ->  Trusted Publishers
# with: GitHub Actions, repo dweekly/quicken-mac-mcp, workflow publish.yml,
# environment release.
#
# The same OIDC token signs an npm provenance attestation (Sigstore) so the
# package page shows a verified link to the source commit and workflow.

on:
  release:
    types: [published]

  # Manual escape hatch. Still requires the Trusted Publisher entry above
  # and publishes whatever version is in the workflow ref's package.json.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC -> npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate publishing so only protected refs / approvers can release.
    environment: release
    steps:
      - name: Checkout the released ref
        uses: actions/checkout@v6

      # Node 24 ships with npm 11.5.1+ (Trusted Publishing requirement).
      # Node 22's bundled npm is 10.x, which silently falls back to
      # NODE_AUTH_TOKEN auth and 404s against TP-protected packages.
      # CI / engines field stay on 22 — only the publish path needs 24.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches the release tag
        # Skip on workflow_dispatch — there is no tag, the dispatcher owns
        # version selection. Only enforced on release events.
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p 'require("./package.json").version')
          # Strip a leading 'v' if present (release tags are v1.3.0).
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Publishing $PKG_VERSION (tag $TAG_NAME)"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

  package-mcpb:
    if: github.event_name == 'release'
    needs: publish
    name: Package MCPB (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            asset: quicken-mac-mcp-arm64.mcpb
          - arch: x64
            runner: macos-15-intel
            asset: quicken-mac-mcp-x64.mcpb
    steps:
      - name: Checkout the released ref
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run pack:mcpb -- "${{ matrix.asset }}"

      - name: Verify native addon architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          # The staging directory is removed after packing, so inspect the
          # native addon embedded in the archive instead.
          unzip -p "${{ matrix.asset }}" \
            node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            > better_sqlite3.node
          file better_sqlite3.node
          case "$EXPECTED_ARCH" in
            arm64) file better_sqlite3.node | grep -q arm64 ;;
            x64) file better_sqlite3.node | grep -q x86_64 ;;
          esac

      - name: Upload bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG_NAME" "$ASSET" --clobber

  publish-registry:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the released ref
        uses: actions/checkout@v6

      - name: Install pinned MCP Registry publisher
        env:
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          curl -fsSL "$PUBLISHER_URL" -o mcp-publisher.tar.gz
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
